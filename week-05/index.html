<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ❌ WRONG: runs before the element is parsed -> TypeError: null -->
  <!-- The browser hasn't reached <div id="menu"> yet when this executes. -->
  <!--
  <script>
    document.getElementById("menu").textContent = "Loading…";
  </script>
  -->

  <!-- ✅ RIGHT option 1: defer waits until the full DOM is parsed -->
  <script src="app.js" defer></script>

  <!-- ✅ RIGHT option 2: place the script just before </body> -->
  <!-- That way the parser has already seen every element above it. -->
</head>
<body>

  <div id="menu">
    <!-- menu content here -->
  </div>

  <!-- Option 2: script here, after all elements -->
  <!-- <script src="app.js"></script> -->

</body>
</html>
